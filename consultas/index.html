<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Consultas</title>
</head>
<body>
    <center>
        <h1>Nova Consulta</h1>
        <form action="http://127.0.0.1:3000" method="post">
        <input type="text" placeholder="Identificacao" name="id" required><br></br>
        <input type="text" placeholder="Paciente" name="paciente" required><br></br>
        <input type="text" placeholder="Data" name="data" required><br></br>
        <select name="unidade" required>
            <option value="Kg">Kg</option>
            <option value="Unidade">Unidade</option><br></br>
        </select><br>
        <input type="number" step ="0.01" placeholder="Peso" name="pesoUnitario" required><br></br>
        <input type="number" step ="0.01"placeholder="Altura" name="quantidade" required><br></br>
        <button type="reset">Limpar</button>
        <button type="submit">Enviar</button>
        </form>
    </center>
</body>
</html>
